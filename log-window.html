<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether - Live Log</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg-0: #09090b;
        --bg-1: #111113;
        --bg-2: #18181b;
        --bg-3: #1e1e22;
        --border: rgba(255,255,255,0.06);
        --text: #fafafa;
        --text-dim: #a1a1aa;
        --text-muted: #52525b;
        --primary: #6366f1;
        --primary-dim: rgba(99,102,241,0.15);
        --accent: #818cf8;
      }

      html, body {
        height: 100%;
        background: var(--bg-0);
        color: var(--text);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      #root {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .titlebar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        background: var(--bg-1);
        border-bottom: 1px solid var(--border);
        -webkit-app-region: drag;
        flex-shrink: 0;
      }
      .titlebar-title {
        font-size: 11px;
        font-weight: 500;
        color: var(--text-dim);
        letter-spacing: 0.02em;
      }
      .titlebar-badge {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--primary-dim);
        color: var(--accent);
        font-weight: 600;
      }
      .titlebar-close {
        margin-left: auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 5px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.15s;
        -webkit-app-region: no-drag;
      }
      .titlebar-close:hover {
        background: rgba(248,113,113,0.15);
        color: #f87171;
      }
      .titlebar-close svg {
        width: 12px;
        height: 12px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background: var(--bg-1);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
        -webkit-app-region: no-drag;
      }

      .search-box {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg-2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 4px 8px;
        transition: border-color 0.15s;
      }
      .search-box:focus-within {
        border-color: var(--primary);
      }
      .search-box svg {
        width: 12px;
        height: 12px;
        color: var(--text-muted);
        flex-shrink: 0;
      }
      .search-box input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 11px;
        font-family: inherit;
      }
      .search-box input::placeholder {
        color: var(--text-muted);
      }
      .search-count {
        font-size: 9px;
        color: var(--text-muted);
        white-space: nowrap;
      }

      .toolbar-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg-2);
        color: var(--text-dim);
        font-size: 10px;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .toolbar-btn:hover {
        background: var(--bg-3);
        color: var(--text);
      }
      .toolbar-btn.active {
        background: var(--primary-dim);
        color: var(--accent);
        border-color: rgba(99,102,241,0.3);
      }
      .toolbar-btn svg {
        width: 12px;
        height: 12px;
      }

      .toolbar-sep {
        width: 1px;
        height: 16px;
        background: var(--border);
      }

      .line-count {
        font-size: 9px;
        color: var(--text-muted);
        white-space: nowrap;
        padding: 0 4px;
      }

      .log-viewport {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 4px 0;
        font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
        font-size: 11px;
        line-height: 1.6;
        scroll-behavior: auto;
        /* Log text must be copyable for bug reports — re-enable selection. */
        user-select: text;
        -webkit-user-select: text;
        cursor: text;
      }
      .log-viewport::-webkit-scrollbar {
        width: 6px;
      }
      .log-viewport::-webkit-scrollbar-track {
        background: transparent;
      }
      .log-viewport::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.08);
        border-radius: 3px;
      }
      .log-viewport::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.15);
      }

      .log-line {
        padding: 0 12px;
        white-space: pre-wrap;
        word-break: break-all;
        color: var(--text-dim);
        transition: background 0.1s;
        animation: log-in 0.22s ease-out;
      }
      @keyframes log-in {
        from {
          opacity: 0;
          transform: translateY(2px);
        }
      }
      .log-line:hover {
        background: rgba(255,255,255,0.02);
      }
      .log-line .ts {
        color: var(--text-muted);
        margin-right: 6px;
        font-size: 10px;
      }
      .log-line.highlight {
        background: var(--primary-dim);
        color: var(--text);
      }
      .log-line.highlight .ts {
        color: var(--accent);
      }
      .log-line.level-error { color: #f87171; }
      .log-line.level-warn { color: #fbbf24; }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 8px;
        color: var(--text-muted);
      }
      .empty-state svg {
        width: 32px;
        height: 32px;
        opacity: 0.3;
      }
      .empty-state p {
        font-size: 12px;
      }
      @media (prefers-reduced-motion: reduce) {
        .log-line {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="titlebar">
        <span class="titlebar-title">AETHER LIVE LOG</span>
        <span class="titlebar-badge" id="statusBadge">IDLE</span>
        <button class="titlebar-close" id="closeBtn" title="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="toolbar">
        <div class="search-box">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Filter logs..." />
          <span class="search-count" id="searchCount"></span>
        </div>
        <button class="toolbar-btn active" id="autoScrollBtn" title="Auto-scroll to bottom">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
          Auto-scroll
        </button>
        <div class="toolbar-sep"></div>
        <span class="line-count" id="lineCount">0 lines</span>
        <button class="toolbar-btn" id="clearBtn" title="Clear log">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          Clear
        </button>
      </div>
      <div class="log-viewport" id="logViewport">
        <div class="empty-state" id="emptyState">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
          <p>Waiting for log output...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/log-window.ts"></script>
  </body>
</html>
