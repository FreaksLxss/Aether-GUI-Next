[package]
name = "aether-gui"
version = "0.17.1"
description = "One-click GUI for the Aether censorship-circumvention tunnel"
edition = "2021"
rust-version = "1.98"

[lib]
name = "aether_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls"] }
zip = "2"
tar = "0.4"
flate2 = "1"
log = "0.4"
base64 = "0.22"
sha2 = "0.10"

[target.'cfg(not(target_os = "android"))'.dependencies]
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Networking_WinInet", "Win32_System_Threading", "Win32_Security", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }
winreg = "0.55"
wintun = "0.5"
pnet_packet = "0.35"
parking_lot = "0.12"
