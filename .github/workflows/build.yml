name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: ""
            aether_asset: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            aether_asset: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            aether_asset: aether-macos-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: ""
            aether_asset: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libevent-2.1-7 libfuse2 patchelf

      - name: Fetch Aether core (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          AETHER_ASSET: ${{ matrix.aether_asset }}
        run: bash src-tauri/binaries/fetch-aether.sh

      - name: Fetch Aether core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./src-tauri/binaries/fetch-aether.ps1

      - name: Test safe engine archive installation
        run: python -m unittest discover -s src-tauri/binaries -p "test_fetch_aether.py"

      - name: Prune other-platform Tor bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          cd src-tauri/binaries/tor
          keep_os=""
          case "$RUNNER_OS" in
            Linux)   keep_os="linux";  keep_arch="x86_64" ;;
            macOS)   keep_os="macos"
                     case "$TARGET" in
                       aarch64*)   keep_arch="aarch64" ;;
                       x86_64*)    keep_arch="x86_64" ;;
                     esac ;;
            Windows) keep_os="windows"; keep_arch="x86_64" ;;
          esac
          for d in ./*/; do
            [ "$(basename "$d")" = "$keep_os" ] || rm -rf "$d"
          done
          for a in "$keep_os"/*/; do
            [ "$(basename "$a")" = "$keep_arch" ] || rm -rf "$a"
          done

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - name: Sign Windows binaries
        if: runner.os == 'Windows' && env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "code-signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $signed = @()
          Get-ChildItem "src-tauri\target" -Recurse -Include *.exe,*.dll,*.msi |
            Where-Object { $_.FullName -match '\\bundle\\' } |
            ForEach-Object {
              & $signtool.FullName sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD `
                /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($_.FullName)" }
              $signed += $_.FullName
            }
          if ($env:GITHUB_REF_TYPE -ne 'tag') { exit 0 }
          foreach ($file in $signed) {
            gh release upload "$env:GITHUB_REF_NAME" "$file" --clobber
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm
            src-tauri/target/**/bundle/**/*setup.exe
            src-tauri/target/**/bundle/**/*.msi
