name: build

# Tauri can't cross-bundle from one OS to another, so each platform builds on
# its own runner. Manual dispatch uploads the bundles as run artifacts (for
# testing); pushing a v* tag additionally attaches them to a draft release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: ""
            aether_asset: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            aether_asset: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            aether_asset: aether-macos-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: ""
            aether_asset: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libevent-2.1-7 libfuse2 patchelf

      - name: Fetch Aether core (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          AETHER_ASSET: ${{ matrix.aether_asset }}
        run: bash src-tauri/binaries/fetch-aether.sh

      # fetch-aether.sh is unix-only (tar.gz assets); the Windows asset is a
      # zip, fetched here with the same version pin and checksum verification.
      - name: Fetch Aether core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = (Select-String -Path src-tauri/binaries/fetch-aether.sh -Pattern 'AETHER_VERSION="(.+)"').Matches[0].Groups[1].Value
          $base = "https://github.com/CluvexStudio/Aether/releases/download/$pin"
          curl.exe -sL -o aether.zip "$base/aether-windows-x86_64.zip"
          curl.exe -sL -o SHA256SUMS.txt "$base/SHA256SUMS.txt"
          $expected = ((Get-Content SHA256SUMS.txt | Select-String 'aether-windows-x86_64.zip') -split '\s+')[0]
          $actual = (Get-FileHash aether.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { throw "Checksum mismatch: $actual != $expected" }
          Expand-Archive aether.zip -DestinationPath aether-extract
          Move-Item aether-extract/aether.exe src-tauri/binaries/aether.exe

      # Only this platform's Tor bundle is needed at runtime (ip_changer.rs
      # resolves binaries/tor/<os>/<arch>/). Pruning the rest stops linuxdeploy
      # from choking on foreign/32-bit ELF during AppImage bundling, and keeps
      # every installer/AppImage small.
      - name: Prune other-platform Tor bundles
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          cd src-tauri/binaries/tor
          keep_os=""
          case "$RUNNER_OS" in
            Linux)   keep_os="linux";  keep_arch="x86_64" ;;
            macOS)   keep_os="macos"
                     case "$TARGET" in
                       aarch64*)   keep_arch="aarch64" ;;
                       x86_64*)    keep_arch="x86_64" ;;
                     esac ;;
            Windows) keep_os="windows"; keep_arch="x86_64" ;;
          esac
          for d in ./*/; do
            [ "$(basename "$d")" = "$keep_os" ] || rm -rf "$d"
          done
          for a in "$keep_os"/*/; do
            [ "$(basename "$a")" = "$keep_arch" ] || rm -rf "$a"
          done

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # linuxdeploy applies system `strip` to every ELF it bundles, including
          # the tor side-library/binaries in resources/. Ubuntu 22.04's old strip
          # chokes on their RELR/RELRO sections ("unknown type [0x13] .relr.dyn"),
          # so skip stripping. Also force extract-and-run so no FUSE is required.
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      # Windows Authenticode sign the built binaries, then re-upload over the
      # (unsigned) bundle tauri-action attached to the draft release. This job
      # is skipped until a code-signing cert is configured in repository
      # secrets (WINDOWS_CERT_BASE64 + WINDOWS_CERT_PASSWORD) — supplying the
      # cert is what actually kills Defender ML false-positives.
      - name: Sign Windows binaries
        if: runner.os == 'Windows' && env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "code-signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $signed = @()
          Get-ChildItem "src-tauri\target" -Recurse -Include *.exe,*.dll,*.msi |
            Where-Object { $_.FullName -match '\\bundle\\' } |
            ForEach-Object {
              & $signtool.FullName sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD `
                /tr "http://timestamp.digicert.com" /td sha256 /fd sha256 $_.FullName
              if ($LASTEXITCODE -ne 0) { throw "Signing failed: $($_.FullName)" }
              $signed += $_.FullName
            }
          if ($env:GITHUB_REF_TYPE -ne 'tag') { exit 0 }
          foreach ($file in $signed) {
            gh release upload "$env:GITHUB_REF_NAME" "$file" --clobber
          }

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm
            src-tauri/target/**/bundle/**/*setup.exe
            src-tauri/target/**/bundle/**/*.msi
